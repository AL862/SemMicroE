name: Import Microeconomics materials
on:
  push:
    branches: [main]
    paths: ['.github/drive-import.json']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore original files and verify their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request
          plan = json.loads(pathlib.Path('.github/drive-import.json').read_text())
          root = pathlib.Path.cwd().resolve()
          def blob(sha):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['GH_REPO']}/git/blobs/{sha}",
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req, timeout=120) as response:
                  obj = json.load(response)
              data = base64.b64decode(obj['content'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == sha, 'Download hash mismatch'
              return data
          for item in plan['files']:
              path = root / item['path']
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              data = b''.join(blob(sha) for sha in item['parts'])
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == item['sha'] and len(data) == item['bytes'], item['path']
              if path.exists():
                  assert path.read_bytes() == data, 'Existing file differs: ' + item['path']
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
              subprocess.run(['git', 'add', '--', item['path']], check=True)
              print('Verified:', item['path'], flush=True)
          for folder in plan['empty_folders']:
              path = root / folder / '.gitkeep'
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              path.parent.mkdir(parents=True, exist_ok=True)
              path.touch()
              subprocess.run(['git', 'add', '--', str(path.relative_to(root))], check=True)
          subprocess.run(['git', 'rm', '--', '.github/drive-import.json'], check=True)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Import all Microeconomics seminar materials from Google Drive'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
